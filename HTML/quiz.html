<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="/CSS/quiz.css">
    <script src="/JS/quiz.js" defer></script>
</head>

<body>
    <header class="topo">
        <p>Laboratório Front-end</p>
        <a href="/index.html">Voltar Ao Inicio</a>
    </header>
    <div class="fundo">
        <section class="subtopo">

            <p>Projeto HTML + CSS + JS</p>
            <h1>Quiz De Tecnologia</h1>
            <h4>Responda Sobre Informática e programação</h4>

        </section>
    </div>
    <main class="main">
        <div class="metrics">
            <div class="metric">
                <div class="atual">
                    <span>Questão Atual</span>
                    <strong id="indice">0 / 6</strong>
                </div>

                <div class="acertos">
                    <span>Acertos</span>
                    <strong id="Acertos">0</strong>
                </div>

                <div class="tempo">
                    <span>Tempo Restante</span>
                    <strong id="tempo">60 segundos</strong>
                </div>
            </div>
        </div>
    </div>
    </main>
</body>

</html>
