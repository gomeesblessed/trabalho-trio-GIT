
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Tecnologia</title>
    <link rel="stylesheet" href="/CSS/quiz.css">
    <script src="/JS/quiz.js" defer></script>
</head>

<body>

    <header class="topo">
        <p>Laboratório Front-end</p>
        <a href="/index.html">Voltar ao início</a>
    </header>

    <div class="fundo">
        <section class="subtopo">
            <p>Projeto HTML + CSS + JS</p>
            <h1>Quiz de Tecnologia</h1>
            <h4>Responda sobre informática e programação</h4>
        </section>
    </div>

    <main class="main">

        <div class="metrics">

            <div class="metric">
                <span>Questão atual</span>
                <strong id="indice">0 / 6</strong>
            </div>

            <div class="metric">
                <span>Acertos</span>
                <strong id="acertos">0</strong>
            </div>

            <div class="metric">
                <span>Tempo restante</span>
                <strong id="tempo">60 segundos</strong>
            </div>

        </div>

        <section class="quiz">
            <h2>Desafio de tecnologia</h2>

            <p id="pergunta">
                Clique no botão para começar!
            </p>

            <div id="alternativas"></div>

            <p id="mensagem"></p>

            <button id="iniciar">Iniciar quiz</button>
            <button id="proxima" hidden>Próxima pergunta</button>
        </section>

    </main>

</body>
</html>
